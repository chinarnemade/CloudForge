# CloudForge Backend Configuration
spring.application.name=cloudforge-backend
server.port=8080

# Management / Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Docker Configuration
# Auto-detects unix:///var/run/docker.sock, unix://$HOME/.docker/run/docker.sock, or tcp://localhost:2375
cloudforge.docker.auto-detect=true
cloudforge.docker.socket-path=
cloudforge.docker.connection-timeout-seconds=5
cloudforge.docker.response-timeout-seconds=45

# Cluster & Persistence
cloudforge.storage.data-dir=./data
cloudforge.scheduler.default-strategy=LEAST_ALLOCATED
cloudforge.monitoring.interval-ms=3000
cloudforge.self-healing.enabled=true
cloudforge.self-healing.interval-ms=5000
